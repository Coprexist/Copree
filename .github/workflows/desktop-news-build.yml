name: Build Desktop News (Windows)

# 只在桌面新闻系统自己的文件变动时触发，不影响主项目的其他工作流。
on:
  push:
    paths:
      - "tools/desktop-news/**"
      - ".github/workflows/desktop-news-build.yml"
    tags:
      - "desktop-news-v*"
  pull_request:
    paths:
      - "tools/desktop-news/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/desktop-news
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 离线单元测试
        run: python -m unittest discover -s tests

      - name: 语法编译检查
        run: python -m compileall -q newscast news_desktop.py autostart.py

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 打包单文件 exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --noconsole
          --name DesktopNews
          --add-data "config.example.json;."
          news_desktop.py

      - name: 附带使用说明与脚本
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/DesktopNews.exe package/
          Copy-Item README.md, config.example.json, install_autostart.bat, uninstall_autostart.bat, run_debug.bat, run_once.bat, check_env.bat package/
          Compress-Archive -Path package/* -DestinationPath DesktopNews-windows.zip -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DesktopNews-windows
          path: tools/desktop-news/DesktopNews-windows.zip
          if-no-files-found: error

      - name: 打 tag 时附到 Release
        if: startsWith(github.ref, 'refs/tags/desktop-news-v')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/desktop-news/DesktopNews-windows.zip
          name: 桌面新闻系统 ${{ github.ref_name }}
          body: |
            班级一体机用的桌面新闻系统（Windows 免安装包）。

            解压后双击 `DesktopNews.exe` 即可运行，再用 `install_autostart.bat` 安装开机自启。
            详细配置见压缩包内的 README.md。
